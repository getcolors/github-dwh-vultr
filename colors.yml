profile: github-dwh-vultr
workdir: .colors

control-plane-host: github-dwh.bigconfig.space
github-org: getcolors
github-include-private: true
github-resources:
  - repositories
  - commits
  - organization-events
  - workflow-runs
  - package-skills

dispatch-calendar: "*:0/15"
dispatch-timezone: UTC

clickhouse-raw-database: raw_github
clickhouse-analytics-database: analytics
clickhouse-marts-database: marts
clickhouse-user: github_dwh

pocketbase-superuser-email: admin@bigconfig.space

provider-compute: vultr
provider-dns: cloudflare
provider-backend: local
compute-prevent-destroy: true

vultr-name: github-dwh-vultr
vultr-region: ams
vultr-plan: vc2-4c-8gb
# Vultr operating systems are numeric ids; 2284 is Ubuntu 24.04 LTS x64.
vultr-os-id: 2284
# A dedicated keypair is generated under the ignored .ssh/ directory. The
# package uploads its public half to Vultr and installs it on this host.
vultr-ssh-key-name: github-dwh-vultr
ssh-private-key: .ssh/id_ed25519
