profile: github-dwh-vultr
workdir: .colors

control-plane-host: github-dwh.bigconfig.space
analytics-host: analytics.github-dwh.bigconfig.space
github-org: getcolors
github-include-private: true
github-resources:
  - repositories
  - commits
  - organization-events
  - workflow-runs
  - package-skills

dispatch-calendar: "*:0/15"
dispatch-timezone: UTC

clickhouse-raw-database: raw_github
clickhouse-analytics-database: analytics
clickhouse-marts-database: marts
clickhouse-user: github_dwh
lightdash-clickhouse-user: lightdash

# --- Lightdash object storage -----------------------------------------------
# Dedicated R2 bucket; credentials are COLORS_PAR_LIGHTDASH_R2_ACCESS_KEY_ID
# and COLORS_PAR_LIGHTDASH_R2_SECRET_ACCESS_KEY, scoped to this bucket only.
lightdash-r2-bucket: github-dwh-lightdash
lightdash-r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
lightdash-r2-region: auto

pocketbase-superuser-email: admin@bigconfig.space

provider-compute: vultr
provider-dns: cloudflare
provider-backend: r2
compute-prevent-destroy: true

# --- State backend ----------------------------------------------------------
# Shared R2 bucket; <profile>/tofu.tfstate keeps this deployment isolated.
# Credentials are COLORS_PAR_R2_ACCESS_KEY_ID / COLORS_PAR_R2_SECRET_ACCESS_KEY.
r2-bucket: tofu-state-319271fed8bc6d2d9059362be1165f37-eu
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com

vultr-name: github-dwh-vultr
vultr-region: ams
vultr-plan: vc2-4c-8gb
# Vultr operating systems are numeric ids; 2284 is Ubuntu 24.04 LTS x64.
vultr-os-id: 2284
# A dedicated keypair is generated under the ignored .ssh/ directory. The
# package uploads its public half to Vultr and installs it on this host.
vultr-ssh-key-name: github-dwh-vultr
ssh-private-key: .ssh/id_ed25519
